name: Build DAQ images

on:
  workflow_dispatch:
    inputs:
      target:
        description: DAQ image target
        required: true
        default: all
        type: choice
        options:
          - all
          - user-daq
          - devel-daq
  push:
    branches:
      - main
    paths:
      - "containers/daq/**"
      - "scripts/smoke-test-daq.sh"
      - ".github/workflows/build-daq.yml"

permissions:
  contents: write
  packages: write

jobs:
  select-targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Select image targets
        id: matrix
        shell: bash
        env:
          REQUESTED_TARGET: ${{ github.event.inputs.target || 'all' }}
        run: |
          case "$REQUESTED_TARGET" in
            all)
              echo 'matrix={"include":[{"target":"user-daq","kind":"user"},{"target":"devel-daq","kind":"devel"}]}' >> "$GITHUB_OUTPUT"
              ;;
            user-daq)
              echo 'matrix={"include":[{"target":"user-daq","kind":"user"}]}' >> "$GITHUB_OUTPUT"
              ;;
            devel-daq)
              echo 'matrix={"include":[{"target":"devel-daq","kind":"devel"}]}' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported target: $REQUESTED_TARGET" >&2
              exit 2
              ;;
          esac

  build:
    needs: select-targets
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix: ${{ fromJson(needs.select-targets.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set UTC tag
        id: tag
        shell: bash
        run: echo "tag=$(date -u +%Y%m%d-%H%Mutc)" >> "$GITHUB_OUTPUT"

      - name: Set image and SIF names
        id: names
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${GITHUB_REPOSITORY#*/}/spadi-${{ matrix.target }}" >> "$GITHUB_OUTPUT"
          echo "sif=spadi-${{ matrix.target }}.sif" >> "$GITHUB_OUTPUT"
          echo "sif_timestamped=spadi-${{ matrix.target }}-${{ steps.tag.outputs.tag }}.sif" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/daq/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          build-args: |
            NPROC=4
          tags: |
            ${{ steps.names.outputs.image }}:${{ steps.tag.outputs.tag }}
            ${{ steps.names.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Pull Docker image
        shell: bash
        run: docker pull --platform linux/amd64 "${{ steps.names.outputs.image }}:${{ steps.tag.outputs.tag }}"

      - name: Smoke test Docker image
        shell: bash
        run: |
          docker run --rm --platform linux/amd64 \
            "${{ steps.names.outputs.image }}:${{ steps.tag.outputs.tag }}" \
            /opt/spadi/scripts/smoke-test-daq.sh "${{ matrix.kind }}"

      - name: Show Docker image size
        shell: bash
        run: docker image ls "${{ steps.names.outputs.image }}:${{ steps.tag.outputs.tag }}"

      - name: Set up Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.4.2

      - name: Log in to GHCR from Apptainer
        shell: bash
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | apptainer registry login \
            --username "$GHCR_USER" \
            --password-stdin docker://ghcr.io

      - name: Build SIF
        shell: bash
        run: |
          apptainer build \
            "${{ steps.names.outputs.sif }}" \
            "docker://${{ steps.names.outputs.image }}:${{ steps.tag.outputs.tag }}"
          cp "${{ steps.names.outputs.sif }}" "${{ steps.names.outputs.sif_timestamped }}"

      - name: Smoke test SIF with clean environment
        shell: bash
        run: |
          export LD_LIBRARY_PATH=/tmp/spadi-host-sentinel/lib
          export CMAKE_PREFIX_PATH=/tmp/spadi-host-sentinel/cmake
          export PKG_CONFIG_PATH=/tmp/spadi-host-sentinel/pkgconfig
          export ROOTSYS=/tmp/spadi-host-sentinel/root
          export PYTHONPATH=/tmp/spadi-host-sentinel/python

          apptainer exec --cleanenv \
            "${{ steps.names.outputs.sif }}" \
            /opt/spadi/scripts/smoke-test-daq.sh "${{ matrix.kind }}"

      - name: Show SIF image size
        shell: bash
        run: ls -lh "${{ steps.names.outputs.sif }}" "${{ steps.names.outputs.sif_timestamped }}"

      - name: Upload SIF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spadi-${{ matrix.target }}-${{ steps.tag.outputs.tag }}-sif
          path: |
            ${{ steps.names.outputs.sif }}
            ${{ steps.names.outputs.sif_timestamped }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish latest SIF release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest SIF images
          prerelease: false
          make_latest: true
          files: |
            ${{ steps.names.outputs.sif }}
            ${{ steps.names.outputs.sif_timestamped }}
          body: |
            Automatically built from successful SPADI container builds.
            Latest DAQ build: ${{ steps.tag.outputs.tag }}
