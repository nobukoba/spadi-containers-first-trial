name: Build FULL images

on:
  workflow_dispatch:
    inputs:
      target:
        description: FULL image target
        required: true
        default: all
        type: choice
        options: [all, user-full, devel-full]
  push:
    branches: [main]
    paths:
      - "containers/fee/**"
      - "containers/daq/**"
      - "containers/artemis/**"
      - "containers/full/**"
      - "scripts/smoke-test-fee.sh"
      - "scripts/smoke-test-daq.sh"
      - "scripts/smoke-test-artemis.sh"
      - "scripts/smoke-test-full.sh"
      - ".github/workflows/build-full.yml"

permissions:
  contents: write
  packages: write

jobs:
  select-targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          REQUESTED_TARGET: ${{ github.event.inputs.target || 'all' }}
        run: |
          case "$REQUESTED_TARGET" in
            all) echo 'matrix={"include":[{"target":"user-full","kind":"user"},{"target":"devel-full","kind":"devel"}]}' >> "$GITHUB_OUTPUT" ;;
            user-full) echo 'matrix={"include":[{"target":"user-full","kind":"user"}]}' >> "$GITHUB_OUTPUT" ;;
            devel-full) echo 'matrix={"include":[{"target":"devel-full","kind":"devel"}]}' >> "$GITHUB_OUTPUT" ;;
            *) exit 2 ;;
          esac

  build-prerequisites:
    runs-on: ubuntu-latest
    outputs:
      fee_devel: ${{ steps.names.outputs.fee_devel }}
      fee_user: ${{ steps.names.outputs.fee_user }}
      daq_devel: ${{ steps.names.outputs.daq_devel }}
      daq_user: ${{ steps.names.outputs.daq_user }}
      artemis_devel: ${{ steps.names.outputs.artemis_devel }}
      artemis_user: ${{ steps.names.outputs.artemis_user }}
    steps:
      - uses: actions/checkout@v4
      - id: names
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${GITHUB_REPOSITORY#*/}"
          suffix="ci-full-${GITHUB_SHA}"
          echo "fee_devel=${repo}/spadi-devel-fee:${suffix}" >> "$GITHUB_OUTPUT"
          echo "fee_user=${repo}/spadi-user-fee:${suffix}" >> "$GITHUB_OUTPUT"
          echo "daq_devel=${repo}/spadi-devel-daq:${suffix}" >> "$GITHUB_OUTPUT"
          echo "daq_user=${repo}/spadi-user-daq:${suffix}" >> "$GITHUB_OUTPUT"
          echo "artemis_devel=${repo}/spadi-devel-artemis:${suffix}" >> "$GITHUB_OUTPUT"
          echo "artemis_user=${repo}/spadi-user-artemis:${suffix}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build FEE and ARTEMIS prerequisites in parallel
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --target devel-fee --build-arg NPROC=4 \
            --cache-from type=gha,scope=devel-fee --cache-to type=gha,mode=max,scope=devel-fee \
            -t "${{ steps.names.outputs.fee_devel }}" --push -f containers/fee/Dockerfile . & p_fee_devel=$!
          docker buildx build --platform linux/amd64 --target user-fee --build-arg NPROC=4 \
            --cache-from type=gha,scope=user-fee --cache-to type=gha,mode=max,scope=user-fee \
            -t "${{ steps.names.outputs.fee_user }}" --push -f containers/fee/Dockerfile . & p_fee_user=$!
          docker buildx build --platform linux/amd64 --target devel-artemis --build-arg NPROC=4 \
            --cache-from type=gha,scope=devel-artemis --cache-to type=gha,mode=max,scope=devel-artemis \
            -t "${{ steps.names.outputs.artemis_devel }}" --push -f containers/artemis/Dockerfile . & p_artemis=$!
          wait "$p_fee_devel"
          wait "$p_fee_user"
          echo "$p_artemis" > /tmp/artemis.pid
      - name: Build DAQ prerequisites from commit-local FEE
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --target devel-daq --build-arg NPROC=4 \
            --build-arg FEE_DEVEL_IMAGE="${{ steps.names.outputs.fee_devel }}" \
            --build-arg FEE_USER_IMAGE="${{ steps.names.outputs.fee_user }}" \
            --cache-from type=gha,scope=devel-daq --cache-to type=gha,mode=max,scope=devel-daq \
            -t "${{ steps.names.outputs.daq_devel }}" --push -f containers/daq/Dockerfile . & p_daq_devel=$!
          docker buildx build --platform linux/amd64 --target user-daq --build-arg NPROC=4 \
            --build-arg FEE_DEVEL_IMAGE="${{ steps.names.outputs.fee_devel }}" \
            --build-arg FEE_USER_IMAGE="${{ steps.names.outputs.fee_user }}" \
            --cache-from type=gha,scope=user-daq --cache-to type=gha,mode=max,scope=user-daq \
            -t "${{ steps.names.outputs.daq_user }}" --push -f containers/daq/Dockerfile . & p_daq_user=$!
          wait "$p_daq_devel"
          wait "$p_daq_user"
          p_artemis="$(cat /tmp/artemis.pid)"
          wait "$p_artemis"

  build:
    needs: [select-targets, build-prerequisites]
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix: ${{ fromJson(needs.select-targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=$(date -u +%Y%m%d-%H%Mutc)" >> "$GITHUB_OUTPUT"
      - id: names
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${GITHUB_REPOSITORY#*/}"
          echo "image=${repo}/spadi-${{ matrix.target }}" >> "$GITHUB_OUTPUT"
          echo "sif=spadi-${{ matrix.target }}.sif" >> "$GITHUB_OUTPUT"
          echo "sif_timestamped=spadi-${{ matrix.target }}-${{ steps.tag.outputs.tag }}.sif" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push FULL Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/full/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          build-args: |
            NPROC=4
            FEE_DEVEL_IMAGE=${{ needs.build-prerequisites.outputs.fee_devel }}
            FEE_USER_IMAGE=${{ needs.build-prerequisites.outputs.fee_user }}
            DAQ_DEVEL_IMAGE=${{ needs.build-prerequisites.outputs.daq_devel }}
            DAQ_USER_IMAGE=${{ needs.build-prerequisites.outputs.daq_user }}
            ARTEMIS_DEVEL_IMAGE=${{ needs.build-prerequisites.outputs.artemis_devel }}
            ARTEMIS_USER_IMAGE=${{ needs.build-prerequisites.outputs.artemis_user }}
          tags: |
            ${{ steps.names.outputs.image }}:${{ steps.tag.outputs.tag }}
            ${{ steps.names.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - run: docker pull --platform linux/amd64 "${{ steps.names.outputs.image }}:${{ steps.tag.outputs.tag }}"
      - name: Smoke test Docker image
        run: docker run --rm --platform linux/amd64 "${{ steps.names.outputs.image }}:${{ steps.tag.outputs.tag }}" /opt/spadi/scripts/smoke-test-full.sh "${{ matrix.kind }}"
      - uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.4.2
      - name: Log in to GHCR from Apptainer
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | apptainer registry login --username "$GHCR_USER" --password-stdin docker://ghcr.io
      - name: Build SIF
        run: |
          apptainer build "${{ steps.names.outputs.sif }}" "docker://${{ steps.names.outputs.image }}:${{ steps.tag.outputs.tag }}"
          cp "${{ steps.names.outputs.sif }}" "${{ steps.names.outputs.sif_timestamped }}"
      - name: Smoke test SIF with clean environment
        run: |
          export LD_LIBRARY_PATH=/tmp/spadi-host-sentinel/lib
          export CMAKE_PREFIX_PATH=/tmp/spadi-host-sentinel/cmake
          export PKG_CONFIG_PATH=/tmp/spadi-host-sentinel/pkgconfig
          export ROOTSYS=/tmp/spadi-host-sentinel/root
          export ARTEMIS_ROOT=/tmp/spadi-host-sentinel/artemis
          export TARTSYS=/tmp/spadi-host-sentinel/tart
          apptainer exec --cleanenv \
            --env SPADI_ROOT=/opt/spadi \
            --env ROOTSYS=/opt/spadi \
            --env ARTEMIS_ROOT=/opt/spadi \
            --env TARTSYS=/opt/spadi \
            --env EXP_CONFIG_ROOT=/opt/spadi/scripts/exp-config \
            --env PATH=/opt/spadi/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --env LD_LIBRARY_PATH=/opt/spadi/lib:/opt/spadi/lib64 \
            --env CMAKE_PREFIX_PATH=/opt/spadi \
            --env PKG_CONFIG_PATH=/opt/spadi/lib/pkgconfig:/opt/spadi/lib64/pkgconfig \
            "${{ steps.names.outputs.sif }}" \
            /opt/spadi/scripts/smoke-test-full.sh "${{ matrix.kind }}"
      - uses: actions/upload-artifact@v4
        with:
          name: spadi-${{ matrix.target }}-${{ steps.tag.outputs.tag }}-sif
          path: |
            ${{ steps.names.outputs.sif }}
            ${{ steps.names.outputs.sif_timestamped }}
          compression-level: 0
          retention-days: 30
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest SIF images
          make_latest: true
          files: |
            ${{ steps.names.outputs.sif }}
            ${{ steps.names.outputs.sif_timestamped }}
