name: Build ARTEMIS images

on:
  workflow_dispatch:
    inputs:
      target:
        description: ARTEMIS image target
        required: true
        default: all
        type: choice
        options: [all, user-artemis, devel-artemis]
  push:
    branches: [main]
    paths:
      - "containers/artemis/**"
      - "scripts/smoke-test-artemis.sh"
      - ".github/workflows/build-artemis.yml"

permissions:
  contents: write
  packages: write

jobs:
  select-targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          REQUESTED_TARGET: ${{ github.event.inputs.target || 'all' }}
        run: |
          case "$REQUESTED_TARGET" in
            all) echo 'matrix={"include":[{"target":"user-artemis","kind":"user"},{"target":"devel-artemis","kind":"devel"}]}' >> "$GITHUB_OUTPUT" ;;
            user-artemis) echo 'matrix={"include":[{"target":"user-artemis","kind":"user"}]}' >> "$GITHUB_OUTPUT" ;;
            devel-artemis) echo 'matrix={"include":[{"target":"devel-artemis","kind":"devel"}]}' >> "$GITHUB_OUTPUT" ;;
            *) exit 2 ;;
          esac

  build:
    needs: select-targets
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix: ${{ fromJson(needs.select-targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=$(date -u +%Y%m%d-%H%Mutc)" >> "$GITHUB_OUTPUT"
      - id: names
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${GITHUB_REPOSITORY#*/}/spadi-${{ matrix.target }}" >> "$GITHUB_OUTPUT"
          echo "sif=spadi-${{ matrix.target }}.sif" >> "$GITHUB_OUTPUT"
          echo "sif_timestamped=spadi-${{ matrix.target }}-${{ steps.tag.outputs.tag }}.sif" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/artemis/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          build-args: NPROC=4
          tags: |
            ${{ steps.names.outputs.image }}:${{ steps.tag.outputs.tag }}
            ${{ steps.names.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - run: docker pull --platform linux/amd64 "${{ steps.names.outputs.image }}:${{ steps.tag.outputs.tag }}"
      - name: Smoke test Docker image
        run: docker run --rm --platform linux/amd64 "${{ steps.names.outputs.image }}:${{ steps.tag.outputs.tag }}" /opt/spadi/scripts/smoke-test-artemis.sh "${{ matrix.kind }}"
      - uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.4.2
      - name: Log in to GHCR from Apptainer
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | apptainer registry login --username "$GHCR_USER" --password-stdin docker://ghcr.io
      - name: Build SIF
        run: |
          apptainer build "${{ steps.names.outputs.sif }}" "docker://${{ steps.names.outputs.image }}:${{ steps.tag.outputs.tag }}"
          cp "${{ steps.names.outputs.sif }}" "${{ steps.names.outputs.sif_timestamped }}"
      - name: Smoke test SIF with clean environment
        run: |
          export LD_LIBRARY_PATH=/tmp/spadi-host-sentinel/lib
          export CMAKE_PREFIX_PATH=/tmp/spadi-host-sentinel/cmake
          export ROOTSYS=/tmp/spadi-host-sentinel/root
          apptainer exec --cleanenv \
            --env SPADI_ROOT=/opt/spadi \
            --env ROOTSYS=/opt/spadi \
            --env ARTEMIS_ROOT=/opt/spadi \
            --env TARTSYS=/opt/spadi \
            --env PATH=/opt/spadi/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --env LD_LIBRARY_PATH=/opt/spadi/lib:/opt/spadi/lib64 \
            --env CMAKE_PREFIX_PATH=/opt/spadi \
            --env PKG_CONFIG_PATH=/opt/spadi/lib/pkgconfig:/opt/spadi/lib64/pkgconfig \
            "${{ steps.names.outputs.sif }}" \
            /opt/spadi/scripts/smoke-test-artemis.sh "${{ matrix.kind }}"
      - uses: actions/upload-artifact@v4
        with:
          name: spadi-${{ matrix.target }}-${{ steps.tag.outputs.tag }}-sif
          path: |
            ${{ steps.names.outputs.sif }}
            ${{ steps.names.outputs.sif_timestamped }}
          compression-level: 0
          retention-days: 30
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest SIF images
          make_latest: true
          files: |
            ${{ steps.names.outputs.sif }}
            ${{ steps.names.outputs.sif_timestamped }}
