name: Build all SPADI images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "containers/**"
      - "scripts/smoke-test-*.sh"
      - ".github/workflows/build-all.yml"

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        include:
          - target: user-fee
            family: fee
            kind: user
          - target: devel-fee
            family: fee
            kind: devel
          - target: user-daq
            family: daq
            kind: user
          - target: devel-daq
            family: daq
            kind: devel
          - target: user-artemis
            family: artemis
            kind: user
          - target: devel-artemis
            family: artemis
            kind: devel
          - target: user-full
            family: full
            kind: user
          - target: devel-full
            family: full
            kind: devel

    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=$(date -u +%Y%m%d-%H%Mutc)" >> "$GITHUB_OUTPUT"

      - id: names
        shell: bash
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${GITHUB_REPOSITORY#*/}"
          suffix="ci-${GITHUB_SHA}-${{ matrix.target }}"
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"
          echo "image=${repo}/spadi-${{ matrix.target }}" >> "$GITHUB_OUTPUT"
          echo "fee_devel=${repo}/spadi-devel-fee:${suffix}" >> "$GITHUB_OUTPUT"
          echo "fee_user=${repo}/spadi-user-fee:${suffix}" >> "$GITHUB_OUTPUT"
          echo "daq_devel=${repo}/spadi-devel-daq:${suffix}" >> "$GITHUB_OUTPUT"
          echo "daq_user=${repo}/spadi-user-daq:${suffix}" >> "$GITHUB_OUTPUT"
          echo "artemis_devel=${repo}/spadi-devel-artemis:${suffix}" >> "$GITHUB_OUTPUT"
          echo "sif=spadi-${{ matrix.target }}.sif" >> "$GITHUB_OUTPUT"
          echo "sif_timestamped=spadi-${{ matrix.target }}-${{ steps.tag.outputs.tag }}.sif" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build commit-local prerequisites
        if: matrix.family == 'daq' || matrix.family == 'full'
        shell: bash
        run: |
          set -euo pipefail

          # Each final target owns its prerequisites. Nothing in this job waits
          # for another matrix target or another workflow to publish :latest.
          if [[ "${{ matrix.family }}" == "full" ]]; then
            docker buildx build --platform linux/amd64 --target devel-artemis --build-arg NPROC=4 \
              --cache-from type=gha,scope=devel-artemis \
              --cache-to type=gha,mode=max,scope=${{ matrix.target }}-artemis-devel \
              -t "${{ steps.names.outputs.artemis_devel }}" --push \
              -f containers/artemis/Dockerfile . &
            p_artemis=$!
          fi

          docker buildx build --platform linux/amd64 --target devel-fee --build-arg NPROC=4 \
            --cache-from type=gha,scope=devel-fee \
            --cache-to type=gha,mode=max,scope=${{ matrix.target }}-fee-devel \
            -t "${{ steps.names.outputs.fee_devel }}" --push \
            -f containers/fee/Dockerfile . &
          p_fee_devel=$!

          docker buildx build --platform linux/amd64 --target user-fee --build-arg NPROC=4 \
            --cache-from type=gha,scope=user-fee \
            --cache-to type=gha,mode=max,scope=${{ matrix.target }}-fee-user \
            -t "${{ steps.names.outputs.fee_user }}" --push \
            -f containers/fee/Dockerfile . &
          p_fee_user=$!

          wait "$p_fee_devel"
          wait "$p_fee_user"

          if [[ "${{ matrix.family }}" == "full" ]]; then
            docker buildx build --platform linux/amd64 --target devel-daq --build-arg NPROC=4 \
              --build-arg FEE_DEVEL_IMAGE="${{ steps.names.outputs.fee_devel }}" \
              --build-arg FEE_USER_IMAGE="${{ steps.names.outputs.fee_user }}" \
              --cache-from type=gha,scope=devel-daq \
              --cache-to type=gha,mode=max,scope=${{ matrix.target }}-daq-devel \
              -t "${{ steps.names.outputs.daq_devel }}" --push \
              -f containers/daq/Dockerfile . &
            p_daq_devel=$!

            docker buildx build --platform linux/amd64 --target user-daq --build-arg NPROC=4 \
              --build-arg FEE_DEVEL_IMAGE="${{ steps.names.outputs.fee_devel }}" \
              --build-arg FEE_USER_IMAGE="${{ steps.names.outputs.fee_user }}" \
              --cache-from type=gha,scope=user-daq \
              --cache-to type=gha,mode=max,scope=${{ matrix.target }}-daq-user \
              -t "${{ steps.names.outputs.daq_user }}" --push \
              -f containers/daq/Dockerfile . &
            p_daq_user=$!

            wait "$p_daq_devel"
            wait "$p_daq_user"
            wait "$p_artemis"
          fi

      - name: Build and push final Docker image
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --platform linux/amd64
            --target "${{ matrix.target }}"
            --build-arg NPROC=4
            --cache-from "type=gha,scope=${{ matrix.target }}"
            --cache-to "type=gha,mode=max,scope=${{ matrix.target }}"
            -t "${{ steps.names.outputs.image }}:${{ steps.tag.outputs.tag }}"
            -t "${{ steps.names.outputs.image }}:latest"
            --push
          )

          case "${{ matrix.family }}" in
            fee)
              docker buildx build "${args[@]}" -f containers/fee/Dockerfile .
              ;;
            daq)
              docker buildx build "${args[@]}" \
                --build-arg FEE_DEVEL_IMAGE="${{ steps.names.outputs.fee_devel }}" \
                --build-arg FEE_USER_IMAGE="${{ steps.names.outputs.fee_user }}" \
                -f containers/daq/Dockerfile .
              ;;
            artemis)
              docker buildx build "${args[@]}" -f containers/artemis/Dockerfile .
              ;;
            full)
              docker buildx build "${args[@]}" \
                --build-arg DAQ_DEVEL_IMAGE="${{ steps.names.outputs.daq_devel }}" \
                --build-arg DAQ_USER_IMAGE="${{ steps.names.outputs.daq_user }}" \
                --build-arg ARTEMIS_DEVEL_IMAGE="${{ steps.names.outputs.artemis_devel }}" \
                -f containers/full/Dockerfile .
              ;;
          esac

      - name: Smoke test Docker image
        shell: bash
        run: |
          docker pull --platform linux/amd64 "${{ steps.names.outputs.image }}:${{ steps.tag.outputs.tag }}"
          docker run --rm --platform linux/amd64 \
            "${{ steps.names.outputs.image }}:${{ steps.tag.outputs.tag }}" \
            "/opt/spadi/scripts/smoke-test-${{ matrix.family }}.sh" "${{ matrix.kind }}"

      - uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.4.2

      - name: Log in to GHCR from Apptainer
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | apptainer registry login --username "$GHCR_USER" --password-stdin docker://ghcr.io

      - name: Build SIF
        shell: bash
        run: |
          apptainer build "${{ steps.names.outputs.sif }}" \
            "docker://${{ steps.names.outputs.image }}:${{ steps.tag.outputs.tag }}"
          cp "${{ steps.names.outputs.sif }}" "${{ steps.names.outputs.sif_timestamped }}"

      - name: Smoke test SIF with clean environment
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH=/tmp/spadi-host-sentinel/lib
          export CMAKE_PREFIX_PATH=/tmp/spadi-host-sentinel/cmake
          export PKG_CONFIG_PATH=/tmp/spadi-host-sentinel/pkgconfig
          export ROOTSYS=/tmp/spadi-host-sentinel/root
          export ARTEMIS_ROOT=/tmp/spadi-host-sentinel/artemis
          export TARTSYS=/tmp/spadi-host-sentinel/tart

          env_args=(
            --env SPADI_ROOT=/opt/spadi
            --env EXP_CONFIG_ROOT=/opt/spadi/scripts/exp-config
            --env PATH=/opt/spadi/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            --env LD_LIBRARY_PATH=/opt/spadi/lib:/opt/spadi/lib64
            --env CMAKE_PREFIX_PATH=/opt/spadi
            --env PKG_CONFIG_PATH=/opt/spadi/lib/pkgconfig:/opt/spadi/lib64/pkgconfig
          )

          if [[ "${{ matrix.family }}" == "artemis" || "${{ matrix.family }}" == "full" ]]; then
            env_args+=(
              --env ROOTSYS=/opt/spadi
              --env ARTEMIS_ROOT=/opt/spadi
              --env TARTSYS=/opt/spadi
            )
          fi

          # A SIF root filesystem is read-only. Bind a runner-owned scratch
          # directory at /workspace so the smoke test validates the intended
          # writable user workspace rather than the immutable image layer.
          sif_workspace="${RUNNER_TEMP}/spadi-workspace-${{ matrix.target }}"
          mkdir -p "$sif_workspace"

          apptainer exec --cleanenv "${env_args[@]}" \
            --bind "${sif_workspace}:/workspace" \
            "${{ steps.names.outputs.sif }}" \
            "/opt/spadi/scripts/smoke-test-${{ matrix.family }}.sh" "${{ matrix.kind }}"

      - uses: actions/upload-artifact@v4
        with:
          name: spadi-${{ matrix.target }}-${{ steps.tag.outputs.tag }}-sif
          path: |
            ${{ steps.names.outputs.sif }}
            ${{ steps.names.outputs.sif_timestamped }}
          compression-level: 0
          retention-days: 30

  publish:
    name: Publish SIF release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: spadi-*-sif
          path: release-files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest SIF images
          make_latest: true
          files: release-files/*.sif
